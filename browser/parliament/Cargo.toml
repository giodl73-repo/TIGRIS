[package]
name = "tigris-parliament-workbench"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tigris-parliament-control"
path = "src/main.rs"

[dependencies]
tigris-sim = { path = "../../tools/tigris-sim", default-features = false }
muddle-core = { git = "https://github.com/giodl73-repo/MUDDLE.git", rev = "08aea37b9849a2e4ec69ea3786efbc09ba57f8d1" }
muddle-cli = { git = "https://github.com/giodl73-repo/MUDDLE.git", rev = "08aea37b9849a2e4ec69ea3786efbc09ba57f8d1" }
muddle-browser-player = { git = "https://github.com/giodl73-repo/MUDDLE.git", rev = "08aea37b9849a2e4ec69ea3786efbc09ba57f8d1", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
wasm-bindgen = "=0.2.127"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
