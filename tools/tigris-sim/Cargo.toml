[package]
name = "tigris-sim"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[features]
default = ["native-hosts"]
native-hosts = ["dep:macroquad", "dep:muddle-cli", "dep:muddle-macroquad", "dep:muddle-window"]

[[bin]]
name = "tigris-sim"
path = "src/main.rs"

[[bin]]
name = "tigris-muddle"
path = "src/bin/tigris-muddle.rs"
required-features = ["native-hosts"]

[[bin]]
name = "tigris-muddle-window"
path = "src/bin/tigris-muddle-window.rs"
required-features = ["native-hosts"]

[[bin]]
name = "tigris-muddle-macroquad"
path = "src/bin/tigris-muddle-macroquad.rs"
required-features = ["native-hosts"]

[dependencies]
court-core = { git = "https://github.com/giodl73-repo/COURT.git", package = "court-core", branch = "main" }
macroquad = { version = "0.4", optional = true }
muddle-cli = { git = "https://github.com/giodl73-repo/MUDDLE.git", rev = "08aea37b9849a2e4ec69ea3786efbc09ba57f8d1", optional = true }
muddle-core = { git = "https://github.com/giodl73-repo/MUDDLE.git", rev = "08aea37b9849a2e4ec69ea3786efbc09ba57f8d1" }
muddle-macroquad = { git = "https://github.com/giodl73-repo/MUDDLE.git", rev = "08aea37b9849a2e4ec69ea3786efbc09ba57f8d1", optional = true }
muddle-window = { git = "https://github.com/giodl73-repo/MUDDLE.git", rev = "08aea37b9849a2e4ec69ea3786efbc09ba57f8d1", optional = true }
rally-core = { git = "https://github.com/giodl73-repo/RALLY.git" }

[dev-dependencies]
racket-core = { git = "https://github.com/giodl73-repo/RACKET.git", package = "racket-core", branch = "main" }
